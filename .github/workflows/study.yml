name: study
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      study:
        description: recovery | confound | lbf | lbfj (join-path LBF; seeds = seed0 per job, lbf_reps = replicate ids) | pt (seeds as seed:kind, one replicate per rep)
        required: true
        default: recovery
      seeds:
        description: comma-separated seeds (one job each)
        required: true
        default: "0,1,2,3,4"
      depths:
        description: lbf only, comma-separated t_root depths (one job per seed x depth)
        required: false
        default: "0.25,0.5,1.0"
      sweeps:
        description: sweeps per chain (recovery/confound) or per stone (lbf)
        required: false
        default: "1500"
      burn:
        required: false
        default: "500"
      lbf_K:
        required: false
        default: "24"
      lbf_warmup:
        description: lbf warm-up sweeps at beta=1 (sequential estimator) / pt warm start sweeps (0 = every stone from the prior)
        required: false
        default: "1200"
      lbf_power:
        required: false
        default: "2"
      concepts:
        description: recovery and pt, number of concepts M per simulated dataset
        required: false
        default: "25"
      pt_hyps:
        description: pt only, semicolon-separated marginal sets per job ("h1;h0" = one job per hypothesis, "h1,h0" = both in one job)
        required: false
        default: "h1;h0"
      lbf_reps:
        description: lbf only, comma-separated replicate ids (0 = primary; >0 re-estimates the same data with fresh stepping-stone seeds)
        required: false
        default: "0"
      knobs:
        description: sampler knobs as in studies/diag.py specs, e.g. "regrow_p=0.1,init=lattice" (become MASSCOMP_* variables)
        required: false
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: python
        run: |
          import json, os
          seeds = [s.strip() for s in "${{ inputs.seeds }}".split(",") if s.strip()]
          study = "${{ inputs.study }}"
          if study == "pt":
              reps = [r.strip() for r in "${{ inputs.lbf_reps }}".split(",") if r.strip()] or ["1"]
              depths = [d.strip() for d in "${{ inputs.depths }}".split(",") if d.strip()]
              hyps = [h.strip() for h in "${{ inputs.pt_hyps }}".split(";") if h.strip()] or ["h1,h0"]
              cells = []
              for s in seeds:
                  seed, kind = s.split(":")
                  # unrelated data do not depend on depth: run them once, at the first depth
                  for d in (depths if kind == "related" else depths[:1]):
                      for r in reps:
                          for h in hyps:
                              cells.append({"seed": seed, "kind": kind, "depth": d, "rep": r, "hyp": h,
                                            "suffix": "_" + kind + "_r" + r + ("" if "," in h else "_" + h)})
          elif study in ("lbf", "lbfj"):
              depths = [d.strip() for d in "${{ inputs.depths }}".split(",") if d.strip()]
              reps = [r.strip() for r in "${{ inputs.lbf_reps }}".split(",") if r.strip()] or ["0"]
              if study == "lbfj":        # one job per (seed, depth) runs every replicate (they share the dataset)
                  cells = [{"seed": s, "depth": d, "rep": ",".join(reps), "suffix": "", "kind": "-", "hyp": "-"} for s in seeds for d in depths]
              else:
                  cells = [{"seed": s, "depth": d, "rep": r, "suffix": ("" if r == "0" else "_r" + r), "kind": "-", "hyp": "-"}
                           for s in seeds for d in depths for r in reps]
          else:
              cells = [{"seed": s, "depth": "-", "rep": "0", "suffix": "", "kind": "-", "hyp": "-"} for s in seeds]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps({"include": cells}) + "\n")

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run cell
        env:
          PYTHONPATH: .
          NUMBA_NUM_THREADS: "1"
          MASSCOMP_PROCS: "4"
          KNOBS: ${{ inputs.knobs }}
        run: |
          mkdir -p results
          eval "$(python studies/knobs.py "$KNOBS")"
          env | grep MASSCOMP_ || true
          case "${{ inputs.study }}" in
            recovery) python studies/recovery.py 1 ${{ matrix.seed }} ${{ inputs.sweeps }} ${{ inputs.burn }} ${{ inputs.concepts }} ;;
            confound) python studies/confound.py 1 ${{ matrix.seed }} ${{ inputs.sweeps }} ${{ inputs.burn }} ;;
            lbf)      python studies/lbf.py 1 ${{ matrix.seed }} ${{ matrix.depth }} ${{ inputs.lbf_K }} ${{ inputs.sweeps }} ${{ inputs.burn }} ${{ inputs.lbf_warmup }} ${{ inputs.lbf_power }} ${{ matrix.rep }} ;;
            lbfj)     python studies/lbfj.py 1 ${{ matrix.seed }} ${{ matrix.depth }} ${{ inputs.lbf_K }} ${{ inputs.sweeps }} ${{ inputs.burn }} ${{ inputs.lbf_warmup }} ${{ inputs.lbf_power }} "${{ matrix.rep }}" ;;
            pt)       python studies/pt_check.py ${{ matrix.seed }} ${{ matrix.depth }} ${{ matrix.kind }} 1 ${{ inputs.lbf_K }} ${{ inputs.sweeps }} ${{ inputs.burn }} ${{ matrix.rep }} ${{ matrix.hyp }} ${{ inputs.concepts }} ${{ inputs.lbf_warmup }} ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ inputs.study }}-${{ matrix.seed }}-${{ matrix.depth }}-${{ matrix.rep }}-${{ matrix.kind }}-${{ matrix.hyp }}
          path: results/${{ inputs.study }}_${{ matrix.seed }}${{ matrix.suffix }}.json

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: cell-${{ inputs.study }}-*
          path: cells
      - name: merge
        run: |
          mkdir -p merged
          python studies/merge.py ${{ inputs.study }} merged/${{ inputs.study }}_${{ github.run_id }}.json $(find cells -name '*.json')
      - name: commit merged results
        run: |
          mkdir -p results/cloud && cp merged/*.json results/cloud/
          git config user.name "masscomp-actions"; git config user.email "actions@users.noreply.github.com"
          git add results/cloud
          git commit -m "results: ${{ inputs.study }} run ${{ github.run_id }}" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; echo "push failed, retry $i"; sleep 30; done
